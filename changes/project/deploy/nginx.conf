# Reverse Proxy für die Produktion (siehe docker-compose.prod.yml).
server {
    listen 80;
    server_name _;
    client_max_body_size 2G;

    # Statische Dateien aus dem Volume, das collectstatic befüllt.
    location /static/ {
        alias /static/;
        expires 7d;
    }

    # Videos, HLS-Segmente und Thumbnails werden nur über die API ausgeliefert.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
