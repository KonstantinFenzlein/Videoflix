# Produktions-Override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Code kommt aus dem Image (kein Code-Mount), DEBUG ist aus, Gunicorn lädt nicht neu,
# und nur nginx ist von außen erreichbar.
services:
  web:
    environment: !override
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    volumes: !override
      - videoflix_media:/app/videoflix/media
      - videoflix_static:/app/staticfiles
    ports: !reset []

  worker:
    environment: !override
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    volumes: !override
      - videoflix_media:/app/videoflix/media

  nginx:
    image: nginx:stable-alpine
    container_name: videoflix_nginx
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - videoflix_static:/static:ro
